name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check
        run: nix flake check

      - name: Build package
        run: nix build .#packages.x86_64-linux.api-actual

      - name: Run unit test suite
        run: nix develop --command bash -c "cd backends/actual && npm ci && npm test"
